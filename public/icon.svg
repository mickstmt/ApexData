<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0B0B0F"/>
  <!-- Apex: the racing line through a corner, clipping the inside kerb -->
  <path d="M96 400 C 96 232, 200 128, 400 112"
        fill="none" stroke="#CCFF00" stroke-width="34" stroke-linecap="round"/>
  <!-- Kerb marks at the apex -->
  <g fill="#F5F5F7">
    <rect x="150" y="322" width="26" height="26" rx="4" transform="rotate(-38 163 335)"/>
    <rect x="186" y="278" width="26" height="26" rx="4" transform="rotate(-30 199 291)"/>
    <rect x="230" y="244" width="26" height="26" rx="4" transform="rotate(-20 243 257)"/>
  </g>
  <!-- Data mark: the telemetry trace stepping up out of the corner -->
  <path d="M300 356 L340 356 L340 300 L380 300 L380 236 L420 236"
        fill="none" stroke="#F5F5F7" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
