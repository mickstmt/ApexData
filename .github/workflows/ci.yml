name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Next.js (lint, types, build)
    runs-on: ubuntu-latest
    env:
      # The build only needs a syntactically valid URL: no query runs at build time.
      DATABASE_URL: postgresql://user:password@localhost:5432/apexdata?schema=public
      NEXT_PUBLIC_JOLPICA_API_URL: https://api.jolpi.ca/ergast/f1
      NEXT_PUBLIC_OPENF1_API_URL: https://api.openf1.org/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  service:
    name: Python service (imports)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-service/requirements.txt

      - run: pip install -r requirements.txt

      # config.py enables the FastF1 disk cache at import time and the directory
      # is gitignored, so a clean checkout needs it created first.
      - run: mkdir -p cache/fastf1

      # No test suite yet, so at least prove the app and its routes import cleanly.
      - run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"
