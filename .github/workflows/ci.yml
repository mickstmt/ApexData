name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Next.js (lint, types, tests, build)
    runs-on: ubuntu-latest
    env:
      # The build runs no queries, so a syntactically valid URL is enough.
      DATABASE_URL: postgresql://user:password@localhost:5432/apexdata?schema=public
      DIRECT_URL: postgresql://user:password@localhost:5432/apexdata?schema=public
      NEXT_PUBLIC_JOLPICA_API_URL: https://api.jolpi.ca/ergast/f1
      NEXT_PUBLIC_OPENF1_API_URL: https://api.openf1.org/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  service:
    name: Python service (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # config.py enables the FastF1 disk cache at import time and the directory
      # is gitignored, so a clean checkout needs it created first.
      - run: mkdir -p cache/fastf1

      - run: pytest -q

      # Also prove the app and all its routes import cleanly.
      - run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"

  e2e:
    name: Pruebas de navegador (Playwright)
    runs-on: ubuntu-latest
    needs: web
    env:
      # A diferencia del job `web`, aquí sí hace falta la base de datos: estas
      # pruebas recorren la app servida, no la compilan. El build se sigue
      # haciendo con credenciales falsas, para no perder la garantía de que
      # compila sin base de datos.
      NEXT_PUBLIC_JOLPICA_API_URL: https://api.jolpi.ca/ergast/f1
      NEXT_PUBLIC_OPENF1_API_URL: https://api.openf1.org/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Build (sin base de datos, como en el job web)
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/apexdata?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/apexdata?schema=public
        run: npm run build

      # El navegador pesa; solo se instala el que usa la configuración.
      - run: npx playwright install --with-deps chromium

      # El secret trae `connection_limit=1`, heredado de cuando el destino era
      # serverless. Producción corre con 5 desde agosto, y el servidor de
      # pruebas debe parecerse a producción: con una sola conexión, las páginas
      # se encolan y las pruebas fallan por tiempo, no por comportamiento.
      - name: Preparar la conexión como en producción
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if echo "$DATABASE_URL" | grep -q 'connection_limit='; then
            ajustada=$(echo "$DATABASE_URL" | sed 's/connection_limit=[0-9]*/connection_limit=5/')
          elif echo "$DATABASE_URL" | grep -q '?'; then
            ajustada="$DATABASE_URL&connection_limit=5"
          else
            ajustada="$DATABASE_URL?connection_limit=5"
          fi
          echo "::add-mask::$ajustada"
          echo "DATABASE_URL=$ajustada" >> "$GITHUB_ENV"

      - name: Ejecutar las pruebas contra el servidor de producción
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run test:e2e

      # Sin esto, un fallo solo dice qué aserción falló y no qué se veía.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to EasyPanel
    runs-on: ubuntu-latest
    needs: [web, service, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-easypanel-apexdata
      cancel-in-progress: false
    steps:
      # IMPORTANT: EasyPanel's own GitHub integration must stay DISABLED for
      # this app. If both fire, the webhook build cancels the one already in
      # progress and the log dies mid-step with "context canceled" — which
      # reads like an out-of-memory kill and is not one. This webhook is the
      # single trigger, and it only runs once lint, types and build pass.
      - name: Trigger EasyPanel deploy
        id: trigger
        env:
          HOOK: ${{ secrets.EASYPANEL_DEPLOY_HOOK }}
        # Secrets are not readable from a job-level `if`, so the skip is
        # decided here: until the webhook is configured in EasyPanel, pushes
        # should not report a red CI for infrastructure that does not exist
        # yet. The webhook returns 200 as soon as the request is accepted,
        # not when the build finishes, so the next step confirms the cutover.
        run: |
          if [ -z "$HOOK" ]; then
            echo "EASYPANEL_DEPLOY_HOOK is not set — deployment not configured yet."
            echo "See DEPLOY.md to create the app and register the webhook."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          curl -fsS "$HOOK"

      - name: Wait for cutover
        if: steps.trigger.outputs.configured == 'true'
        # Succeeds once the container serving production booted after this
        # commit was pushed. Comparing boot time against the push timestamp
        # (rather than an uptime baseline) is immune to who triggered the
        # deploy, and the 60s of slack absorbs clock skew with the VPS.
        env:
          PUSHED_AT: ${{ github.event.head_commit.timestamp }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL repository variable is not set; skipping cutover check."
            exit 0
          fi

          # Trailing whitespace or a stray slash in the repository variable is
          # invisible in the GitHub UI and would silently break every request.
          APP_URL=$(echo "$APP_URL" | tr -d '[:space:]')
          APP_URL="${APP_URL%/}"

          pushed_epoch=$(( $(date -d "$PUSHED_AT" +%s) - 60 ))
          echo "commit pushed at: $PUSHED_AT"
          echo "polling: $APP_URL/api/health"

          for i in $(seq 1 30); do
            # -L because an http:// value would otherwise return a redirect body
            # with no JSON in it. Errors are NOT silenced: hiding curl's stderr
            # is what turned a broken health check into thirty identical lines
            # of "no response yet" with no way to tell why.
            resp=$(curl -fsSL --max-time 20 "$APP_URL/api/health" 2>/tmp/curl_err) || true
            code=$?
            boot=$(echo "$resp" | sed -n 's/.*"startedAt":"\([^"]*\)".*/\1/p')

            if [ -n "$boot" ]; then
              boot_epoch=$(date -d "$boot" +%s)
              if [ "$boot_epoch" -gt "$pushed_epoch" ]; then
                build=$(echo "$resp" | sed -n 's/.*"buildId":"\([^"]*\)".*/\1/p')
                echo "Serving a container booted at $boot (buildId=${build:-unknown})"
                exit 0
              fi
              echo "[$i/30] still the pre-push container (startedAt=$boot)"
            elif [ -n "$resp" ]; then
              echo "[$i/30] answered, but with no startedAt: $(echo "$resp" | head -c 200)"
            else
              echo "[$i/30] no answer (curl exit $code): $(head -c 200 /tmp/curl_err)"
            fi

            sleep 30
          done

          echo "No cutover detected after 15 minutes. Check the EasyPanel build log."
          exit 1
